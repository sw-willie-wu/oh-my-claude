WORKERS_SHOW_TYPE=true
WORKERS_SHOW_ELAPSED=true
WORKERS_MAX=5
WORKERS_AGENT_ICON=""
WORKERS_SHELL_ICON=""
WORKERS_SHELL_MAX_AGE=3600
