# oh-my-claude configuration
# Theme: catppuccin | dracula | nord | gruvbox | tokyonight | onedark | solarized | rosepine
THEME="catppuccin"

# Layout: default | minimal | powerline | pure | fancy
LAYOUT="fancy"

# Account (from ~/.claude.json; hidden on API-key logins)
# ACCOUNT_FORMAT: name | fullname | email | org
ACCOUNT_SHOW=true
ACCOUNT_FORMAT=name
# Account icon: uncomment to override; set to "" to hide.
# ACCOUNT_ICON=$'\xef\x80\x87'

# Where the account name comes from: config | auto (unset = config).
#   config  the name in ~/.claude.json. No token is read and nothing goes over
#           the network. Another Claude client on this machine (for example the
#           desktop app logged into a different account) can overwrite that
#           file, so it may name a different account than the one this session
#           uses.
#   auto    when the credentials file changes (login, account switch, token
#           refresh) read this session's token and make one background HTTPS
#           request to api.anthropic.com for the real account name. The result
#           is cached, so normal renders cost nothing extra. No effect without
#           a credentials file (macOS Keychain, API key).
# /oh-my-status:setup asks about this.
# ACCOUNT_SOURCE=config

# Append " [1M]" to the model name when the context window is 1M or larger.
MODEL_CTX_TAG=true

# Git-info cache TTL (seconds). git runs at most once per TTL. A branch switch,
# commit or stage shows up at the next render anyway (the cache watches .git);
# edits to working-tree files show up within TTL seconds. 0 = no cache (run git
# every render).
GIT_CACHE_TTL=10
