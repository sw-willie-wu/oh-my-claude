# oh-my-claude configuration
# Theme: catppuccin | dracula | nord | gruvbox | tokyonight | onedark | solarized | rosepine
THEME="catppuccin"

# Layout: default | minimal | powerline | pure | fancy
LAYOUT="fancy"

# Workers (background shells)
WORKERS_ENABLED=true
WORKERS_SHOW_SHELLS=true
WORKERS_SHOW_ELAPSED=true
WORKERS_MAX=5
# Shell row icon: the theme default is used unless you set this. To override,
# uncomment and edit; set to "" to hide the icon.
# WORKERS_SHELL_ICON=$'\xe2\x8f\xb3'
WORKERS_SHELL_MAX_AGE=3600

# Account (from ~/.claude.json; hidden on API-key logins)
# ACCOUNT_FORMAT: name | fullname | email | org
ACCOUNT_SHOW=true
ACCOUNT_FORMAT=name
# Account icon: uncomment to override; set to "" to hide.
# ACCOUNT_ICON=$'\xef\x80\x87'

# Append " [1M]" to the model name when the context window is 1M or larger.
MODEL_CTX_TAG=true

# Git-info cache TTL (seconds). A low statusLine refreshInterval keeps the
# Workers section live but would otherwise run git every tick. With caching,
# git runs at most once per TTL; a branch switch / commit / stage in the same
# directory shows up within TTL seconds (default <=3, imperceptible). Set 0
# to disable caching = always run git = instant git accuracy (legacy behavior).
GIT_CACHE_TTL=3
